spring:
  application:
    name: lovable-clone

  datasource:
    url: jdbc:postgresql://localhost:5433/lovable_clone_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  config: classpath:log4j2-spring.yml
  level:
    root: INFO
    com.devanshu: DEBUG

server:
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET}

stripe:
  api:
    secret: ${STRIPE_API_SECRET}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}

panel-url:
  admin: http://localhost:8080