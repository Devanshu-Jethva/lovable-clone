spring:
  application:
    name: lovable-clone

  datasource:
    url: jdbc:postgresql://localhost:9010/lovable_clone_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

#  ai:
#    openai:
#      api-key: ${OPEN_ROUTER_API_KEY}
#      base-url: https://openrouter.ai/api/v1
#      chat:
##        model: openrouter/free
#        model: google/gemma-4-31b-it:free
#        temperature: 0.0
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-3.8-flash
          temperature: 0.0
          thinking-level: LOW

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  config: classpath:log4j2-spring.yml
  level:
    root: INFO
    com.devanshu: DEBUG
    org.springframework.ai:
      chat.client: DEBUG

server:
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET}

stripe:
  api:
    secret: ${STRIPE_API_SECRET}
  webhook:
    secret: ${STRIPE_WEBHOOK_SINGING_SECRET}

panel-url:
  admin: http://localhost:8080

minio:
  url: http://localhost:9000          # or minio:9000 if inside docker network
  access-key: minioadmin
  secret-key: minioadmin123
  project-bucket: projects